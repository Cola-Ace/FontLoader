[package]
name = "font-loader"
version = "0.1.3"
description = "Windows temporary font loader"
authors = ["FontLoader contributors"]
edition = "2021"

[lib]
name = "font_loader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "FontLoader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
